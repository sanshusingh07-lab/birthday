databases:
  - name: birthday-database
    databaseName: birthday_db
    user: birthday_user
    plan: free
    region: oregon

services:
  - type: web
    name: birthday-surprise
    env: python
    region: oregon
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: birthday-database
          property: connectionString
